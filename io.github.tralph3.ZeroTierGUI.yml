app-id: io.github.tralph3.ZeroTierGUI
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: zerotier-gui-launcher

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Host ZeroTier commands, polkit and desktop theme preferences.
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=/var/lib/zerotier-one:ro
  # Required to create the "start at login" entry on the host.
  - --filesystem=xdg-config/autostart

modules:
  # QtNetwork links against GSSAPI even though this app does not use it.
  # Bundle the small Debian runtime libraries required by the PySide6 wheel.
  - name: krb5-libraries
    buildsystem: simple
    build-commands:
      - |
        set -eu
        mkdir -p ${FLATPAK_DEST}/lib unpack
        for package in *.deb; do
          rm -rf unpack/*
          (cd unpack && ar x "../$package" && tar -xf data.tar.*)
          for library in libgssapi_krb5.so* libkrb5.so* libk5crypto.so* libkrb5support.so* libcom_err.so* libkeyutils.so*; do
            for source in unpack/usr/lib/x86_64-linux-gnu/$library; do
              if [ -e "$source" ]; then cp -a "$source" ${FLATPAK_DEST}/lib/; fi
            done
          done
        done
    sources:
      - type: file
        url: https://deb.debian.org/debian/pool/main/k/krb5/libgssapi-krb5-2_1.21.3-5+deb13u1_amd64.deb
        sha256: 30847c1fde4240567d7ed3aeab4f655dd591203758b857e85e824045aae70299
      - type: file
        url: https://deb.debian.org/debian/pool/main/k/krb5/libkrb5-3_1.21.3-5+deb13u1_amd64.deb
        sha256: 47d71d6a7f2e59b9bae5f89602397594805113b95889ad18fa703cd53abafc97
      - type: file
        url: https://deb.debian.org/debian/pool/main/k/krb5/libk5crypto3_1.21.3-5+deb13u1_amd64.deb
        sha256: 7da07ee674b47f1f0be7cc89317c25310086a1f1761217d0f72e6ae2c5a69b84
      - type: file
        url: https://deb.debian.org/debian/pool/main/k/krb5/libkrb5support0_1.21.3-5+deb13u1_amd64.deb
        sha256: 3a0acd8b37955c0e102c756b52c97df2a31f67b96453c35dab70df218d309117
      - type: file
        url: https://deb.debian.org/debian/pool/main/e/e2fsprogs/libcom-err2_1.47.2-3+b12_amd64.deb
        sha256: bd43e020b8fed399db3eebf098111f10fba4c436fff99ccad72cc7e27c9764ec
      - type: file
        url: https://deb.debian.org/debian/pool/main/k/keyutils/libkeyutils1_1.6.3-6_amd64.deb
        sha256: 0b11ad17be0300b63ad4eeb4c6450fed24d34b7b740f23e5363dcb29ee6d5eba

  - name: shiboken6
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} shiboken6-6.8.2.1-cp39-abi3-manylinux_2_28_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/7b/ff/ab4f287b9573e50b5a47c10e2af8feb5abecc3c7431bd5deec135efc969e/shiboken6-6.8.2.1-cp39-abi3-manylinux_2_28_x86_64.whl
        sha256: c83e90056f13d0872cc4d2b7bf60b6d6e3b1b172f1f91910c0ba5b641af01758
  - name: pyside6-essentials
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} PySide6_Essentials-6.8.2.1-cp39-abi3-manylinux_2_28_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/d2/f9/aa4ff511ff1f3dd177f7e8f5a635e03fe578fa2045c8d6be4577e7db3b28/PySide6_Essentials-6.8.2.1-cp39-abi3-manylinux_2_28_x86_64.whl
        sha256: 5ab31e5395a4724102edd6e8ff980fa3f7cde2aa79050763a1dcc30bb914195a
  - name: zerotier-gui
    buildsystem: simple
    build-commands:
      - install -Dm755 src/zerotier-gui ${FLATPAK_DEST}/bin/zerotier-gui
      - install -Dm755 packaging/flatpak/zerotier-gui.sh ${FLATPAK_DEST}/bin/zerotier-gui-launcher
      - install -Dm755 packaging/flatpak/zerotier-cli ${FLATPAK_DEST}/bin/zerotier-cli
      - install -Dm755 packaging/flatpak/systemctl ${FLATPAK_DEST}/bin/systemctl
      - install -Dm755 packaging/flatpak/pkexec ${FLATPAK_DEST}/bin/pkexec
      - install -Dm755 packaging/flatpak/ip ${FLATPAK_DEST}/bin/ip
      - pyver=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])'); site="${FLATPAK_DEST}/lib/python${pyver}/site-packages"; install -d "$site"; cp -R src/zerotier_gui "$site/"
      - install -Dm644 img/zerotier-gui.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 zerotier-gui.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - sed -i "s|Icon=zerotier-gui|Icon=${FLATPAK_ID}|" ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - sed -i "s|Exec=/usr/bin/zerotier-gui|Exec=zerotier-gui-launcher|" ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
    sources:
      - type: dir
        path: .
